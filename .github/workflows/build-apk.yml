name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name'
        required: false
        default: '0.1.0'
        type: string
  push:
    branches:
      - implementation/phase-0-audit-and-android-hardening
      - repair/full-project-hardening
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-android:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ inputs.version || github.ref_name }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"; then
              exit 0
            fi
            echo "Android SDK package installation failed (attempt $attempt/3); clearing incomplete NDK download before retry."
            rm -rf "$ANDROID_SDK_ROOT/ndk/27.0.12077973" "$ANDROID_SDK_ROOT/.temp"/*
            sleep 8
          done
          exit 1

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists
        id: apk
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: 2OneByte-Coder-Android-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
