name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android
          # Every CI build gets a strictly increasing Android versionCode.
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: onebyte-android-debug-keystore-v1
      - name: Create stable Android debug signing key if missing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, OU=Development, O=2OneByte, L=Cairo, ST=Cairo, C=EG"
          fi
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/2OneByte-Coder.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 2OneByte-Coder-apk
          path: out/2OneByte-Coder.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 2OneByte-Coder build ${{ github.run_number }}
          files: out/2OneByte-Coder.apk
