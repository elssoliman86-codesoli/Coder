name: Build Android APK

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      uploadArtifacts:
        description: 'Upload APK as artifact'
        required: true
        default: true
        type: boolean

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.5'
  NODE_VERSION: '20'
  ANDROID_SDK_VERSION: '34'
  ANDROID_NDK_VERSION: '27.0.12077973'

jobs:
  build-web:
    name: Build Web Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      webDir: ${{ steps.set-output.outputs.webDir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build web application
        run: npm run build
        working-directory: .
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Set output
        id: set-output
        run: echo "webDir=out" >> $GITHUB_OUTPUT

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: out/
          retention-days: 7

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: out/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          cmdline-tools-version: 'latest'
          build-tools-version: '34.0.0'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Setup Node.js for Capacitor
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: .

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK
        if: github.event.inputs.buildType != 'release' || github.event_name != 'workflow_dispatch'
        run: ./gradlew assembleDebug
        working-directory: ./android

      - name: Build Release APK
        if: github.event.inputs.buildType == 'release' || github.event_name != 'workflow_dispatch'
        run: ./gradlew assembleRelease
        working-directory: ./android
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}

      - name: Find APK files
        id: find-apk
        run: |
          echo "debug_apk=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)" >> $GITHUB_OUTPUT
          echo "release_apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        if: github.event.inputs.buildType != 'release' || github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find-apk.outputs.debug_apk }}
          retention-days: 30

      - name: Upload Release APK
        if: github.event.inputs.buildType == 'release' || github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.find-apk.outputs.release_apk }}
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.find-apk.outputs.debug_apk }}
            ${{ steps.find-apk.outputs.release_apk }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-aab:
    name: Build Android App Bundle (AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-web
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: out/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          cmdline-tools-version: 'latest'
          build-tools-version: '34.0.0'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Setup Node.js for Capacitor
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: .

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Release AAB
        run: ./gradlew bundleRelease
        working-directory: ./android
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}

      - name: Find AAB file
        id: find-aab
        run: echo "aab_path=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)" >> $GITHUB_OUTPUT

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: ${{ steps.find-aab.outputs.aab_path }}
          retention-days: 30

      - name: Create Release with AAB
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.find-aab.outputs.aab_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}