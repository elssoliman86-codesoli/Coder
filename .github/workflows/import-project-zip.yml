name: Import project ZIP

on:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

concurrency:
  group: import-project-zip
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find uploaded ZIP
        id: archive
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "No ZIP found in repository root."
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Validate and extract archive
        env:
          ZIP: ${{ steps.archive.outputs.zip }}
        run: |
          python3 - <<'PY'
          import os, sys, zipfile
          path = os.environ["ZIP"]
          with zipfile.ZipFile(path) as z:
              for item in z.infolist():
                  name = item.filename.replace("\\\\", "/")
                  parts = name.split("/")
                  if name.startswith("/") or any(p == ".." for p in parts):
                      raise SystemExit(f"Unsafe archive path: {name}")
              z.extractall("extracted")
          PY

      - name: Replace repository files with archive contents
        env:
          ZIP: ${{ steps.archive.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t roots < <(find extracted -mindepth 1 -maxdepth 1 -type d -print)
          if [ "${#roots[@]}" -eq 1 ] && [ -d "${roots[0]}" ]; then
            SOURCE="${roots[0]}"
          else
            SOURCE="extracted"
          fi
          test -f "$SOURCE/package.json" || { echo "package.json not found at archive root"; exit 1; }
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/import-project-zip.yml' \
            "$SOURCE/" ./
          rm -f "$ZIP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Import project source from uploaded ZIP"
            git push
          fi
