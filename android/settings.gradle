pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = '2OneByte-Coder'

include ':app'

def capacitorProperties = new Properties()
def capacitorPropertiesFile = file('capacitor.properties')
if (capacitorPropertiesFile.exists()) {
    capacitorProperties.load(new FileInputStream(capacitorPropertiesFile))
}

def capacitorAndroidDir = capacitorProperties.getProperty('android.capacitor.dir', '../node_modules/@capacitor/android')
if (!file(capacitorAndroidDir).isAbsolute()) {
    capacitorAndroidDir = file(rootProject.projectDir, capacitorAndroidDir).absolutePath
}

include ':capacitor-android'
project(':capacitor-android').projectDir = new File(capacitorAndroidDir)

def capacitorCoreDir = capacitorProperties.getProperty('android.capacitor.dir', '../node_modules/@capacitor/android')
def capacitorAppDir = capacitorCoreDir.replace('android', 'app')
if (file(capacitorAppDir).exists()) {
    include ':capacitor-app'
    project(':capacitor-app').projectDir = new File(capacitorAppDir)
}

def capacitorHapticsDir = capacitorCoreDir.replace('android', 'haptics')
if (file(capacitorHapticsDir).exists()) {
    include ':capacitor-haptics'
    project(':capacitor-haptics').projectDir = new File(capacitorHapticsDir)
}

def capacitorKeyboardDir = capacitorCoreDir.replace('android', 'keyboard')
if (file(capacitorKeyboardDir).exists()) {
    include ':capacitor-keyboard'
    project(':capacitor-keyboard').projectDir = new File(capacitorKeyboardDir)
}

def capacitorPreferencesDir = capacitorCoreDir.replace('android', 'preferences')
if (file(capacitorPreferencesDir).exists()) {
    include ':capacitor-preferences'
    project(':capacitor-preferences').projectDir = new File(capacitorPreferencesDir)
}

def capacitorSplashScreenDir = capacitorCoreDir.replace('android', 'splash-screen')
if (file(capacitorSplashScreenDir).exists()) {
    include ':capacitor-splash-screen'
    project(':capacitor-splash-screen').projectDir = new File(capacitorSplashScreenDir)
}

def capacitorStatusBarDir = capacitorCoreDir.replace('android', 'status-bar')
if (file(capacitorStatusBarDir).exists()) {
    include ':capacitor-status-bar'
    project(':capacitor-status-bar').projectDir = new File(capacitorStatusBarDir)
}